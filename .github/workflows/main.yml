name: DFIR GPS Parser CI Workflow
on:
  push:
    branches: [ "main" ]
jobs:
  verify-forensic-parser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code source
        uses: actions/checkout@v3
      - name: Configuration Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Exécution du script forensic
        run: python parse_gps.py
      - name: Vérification du fichier CSV de sortie
        run: test -f output_cleaned.csv || (echo "[ERROR] CSV manquant" && exit 1)
      - name: Contrôle d'intégrité SHA-256 en CI
        run: sha256sum output_cleaned.csv